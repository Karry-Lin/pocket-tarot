apiVersion: apps/v1
kind: Deployment
metadata:
  name: karrylin-pocket-tarot-server-dev
  labels:
    app.kubernetes.io/name: karrylin-pocket-tarot-server
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karrylin-pocket-tarot-server
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karrylin-pocket-tarot-server
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: dev
    spec:
      containers:
        - name: api
          image: registry.kkserver.net/karrylin-pocket-tarot-server:dev-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/pocket-tarot/firebase-service-account.json
          envFrom:
            - secretRef:
                name: karrylin-pocket-tarot-server-secrets-dev
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: firebase-service-account
              mountPath: /var/run/secrets/pocket-tarot
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: firebase-service-account
          secret:
            secretName: karrylin-pocket-tarot-server-secrets-dev
            items:
              - key: firebase-service-account.json
                path: firebase-service-account.json
