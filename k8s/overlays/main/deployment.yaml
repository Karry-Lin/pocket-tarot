apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-tarot-server-main
  labels:
    app.kubernetes.io/name: pocket-tarot-server
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: main
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-tarot-server
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-tarot-server
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: main
    spec:
      containers:
        - name: api
          image: registry.kkserver.net/pocket-tarot-server:main-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/pocket-tarot/firebase-service-account.json
          envFrom:
            - secretRef:
                name: pocket-tarot-server-secrets-main
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: firebase-service-account
              mountPath: /var/run/secrets/pocket-tarot
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: firebase-service-account
          secret:
            secretName: pocket-tarot-server-secrets-main
            items:
              - key: firebase-service-account.json
                path: firebase-service-account.json
