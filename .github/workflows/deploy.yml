name: Build and Deploy Server to K8s

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  IMAGE_NAME: karrylin-pocket-tarot-server
  IMAGE_REGISTRY: registry.kkserver.net
  K8S_NAMESPACE: apps
  SERVER_DIR: server

jobs:
  verify:
    runs-on: "karrylin-pocket-tarot"
    environment: main
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          MONGODB_URI: ${{ secrets.TEST_MONGODB_URI || secrets.MONGODB_URI }}
        run: |
          if [ -z "${MONGODB_URI:-}" ]; then
            echo "MONGODB_URI is required for server tests"
            exit 1
          fi

          npm test

      - name: Run TypeScript build
        run: npm run build

  deploy:
    runs-on: "karrylin-pocket-tarot"
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'dev')
    environment: main
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deploy context
        run: |
          set -euo pipefail

          REF_NAME="${{ github.ref_name }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REF_SLUG=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#-+#-#g; s#(^[-.]+|[-.]+$)##g')
          IMAGE_TAG="${REF_SLUG}-${SHORT_SHA}"
          IMAGE_REF="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          DEPLOY_BRANCH="$REF_NAME"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"
          echo "DEPLOY_BRANCH=${DEPLOY_BRANCH}" >> "$GITHUB_ENV"
          echo "SECRET_NAME=karrylin-pocket-tarot-server-secrets-${DEPLOY_BRANCH}" >> "$GITHUB_ENV"
          echo "KUSTOMIZE_DIR=k8s/overlays/${DEPLOY_BRANCH}" >> "$GITHUB_ENV"
          echo "RESOURCE_NAME=karrylin-pocket-tarot-server-${DEPLOY_BRANCH}" >> "$GITHUB_ENV"
          echo "Deploy context: branch=${DEPLOY_BRANCH} image_tag=${IMAGE_TAG} image_ref=${IMAGE_REF}"

      - name: Build Docker image
        run: |
          docker build \
            --progress=plain \
            -t "${IMAGE_REF}:${IMAGE_TAG}" \
            -f "${{ env.SERVER_DIR }}/Dockerfile" \
            "${{ env.SERVER_DIR }}"

      - name: Push image to registry
        run: |
          docker push "${IMAGE_REF}:${IMAGE_TAG}"

      - name: Create Firebase service account file
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_SERVICE_ACCOUNT_BASE64:-}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_BASE64 is required"
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Create or update secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail

          for name in MONGODB_URI ADMIN_API_KEY LLM_BASE_URL LLM_API_KEY LLM_MODEL; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required"
              exit 1
            fi
          done

          kubectl create secret generic "${SECRET_NAME}" \
            --namespace="${{ env.K8S_NAMESPACE }}" \
            --from-literal=MONGODB_URI="$MONGODB_URI" \
            --from-literal=ADMIN_API_KEY="$ADMIN_API_KEY" \
            --from-literal=LLM_BASE_URL="$LLM_BASE_URL" \
            --from-literal=LLM_API_KEY="$LLM_API_KEY" \
            --from-literal=LLM_MODEL="$LLM_MODEL" \
            --from-file=firebase-service-account.json="$RUNNER_TEMP/firebase-service-account.json" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          set -euo pipefail

          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|g" "${KUSTOMIZE_DIR}/kustomization.yaml"
          kubectl apply -k "${KUSTOMIZE_DIR}"

      - name: Verify deployment
        run: |
          set -euo pipefail

          kubectl rollout status "deployment/${RESOURCE_NAME}" \
            -n "${{ env.K8S_NAMESPACE }}" \
            --timeout=120s

          echo "========== Pods =========="
          kubectl get pods -n "${{ env.K8S_NAMESPACE }}" -l "app.kubernetes.io/name=karrylin-pocket-tarot-server,app.kubernetes.io/instance=${DEPLOY_BRANCH}"

          echo "========== Service =========="
          kubectl get svc "${RESOURCE_NAME}" -n "${{ env.K8S_NAMESPACE }}"
